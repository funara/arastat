<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARAStat Update</title>
    <style>
      :root {
        --accent: #4a9eff;
        --accent-hover: #3a8eef;
        --accent-deep: #1545a8;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --border: #2d3137;
        --panel: #1e2124;
        --track: #262a2f;
        --err: #f87171;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, 'Segoe UI', sans-serif;
        color: var(--text);
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-radius: 12px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      #hero {
        background: linear-gradient(135deg, #2a6ff0, var(--accent-deep));
        padding: 30px 0 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #hero img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        /* White plate: the icon tile is blue and disappeared into the blue hero. */
        background: #fff;
        padding: 6px;
        -webkit-app-region: no-drag;
      }
      #headline {
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #versions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.92);
        font-size: 13px;
      }
      #versions .chip {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 2px 10px;
        font-variant-numeric: tabular-nums;
      }
      #versions .chip.new {
        background: #fff;
        color: var(--accent-deep);
        font-weight: 600;
      }
      #body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 22px 28px 20px;
      }
      #desc {
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-muted);
        text-align: center;
      }
      #desc.error {
        color: var(--err);
      }
      #action {
        -webkit-app-region: no-drag;
        width: 100%;
        height: 44px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #0b1017;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      #action:hover {
        background: var(--accent-hover);
      }
      #progress {
        width: 100%;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      #progress .track {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      #progress .bar {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-deep));
        transition: width 0.2s;
      }
      #progress .label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      #later {
        -webkit-app-region: no-drag;
        background: none;
        border: none;
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      #later:hover {
        color: var(--text);
      }
      #changelog {
        width: 100%;
        display: none;
        flex-direction: column;
        gap: 6px;
        text-align: left;
        -webkit-app-region: no-drag;
      }
      #changelog h4 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      #changelog-body {
        max-height: 96px;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.55;
        color: var(--text);
        white-space: pre-line;
        background: var(--track);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
      }
      #changelog-body::-webkit-scrollbar { width: 8px; }
      #changelog-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="hero">
        <img src="./src/assets/ara-icon.png" alt="ARAStat" />
        <div id="headline"></div>
        <div id="versions">
          <span class="chip" id="ver-current"></span>
          <span>→</span>
          <span class="chip new" id="ver-new"></span>
        </div>
      </div>
      <div id="body">
        <div id="desc"></div>
        <div id="changelog" hidden>
          <h4>What's new</h4>
          <div id="changelog-body"></div>
        </div>
        <div id="progress">
          <div class="track"><div class="bar" id="bar"></div></div>
          <div class="label"><span id="progress-text"></span><span id="percent"></span></div>
        </div>
        <button id="action"></button>
        <button id="later"></button>
      </div>
    </div>
    <script type="module" src="/src/update.ts"></script>
  </body>
</html>
